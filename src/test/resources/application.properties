spring.application.name=ubmager-test

# Database pengujian: H2 in-memory, tidak menyentuh Supabase/kelompok
spring.datasource.url=jdbc:h2:mem:ubmager_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
