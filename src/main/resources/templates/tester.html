<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tester API UBMager</title>
    <!-- Manggil Tailwind v4 via CDN biar langsung jalan -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 p-8 font-sans">
    <div class="max-w-2xl mx-auto space-y-6">
      <h1 class="text-3xl font-extrabold text-center text-slate-800">
        🚀 Tester API UBMager
      </h1>

      <!-- 1. Form Registrasi -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-700 mb-4">
          1. Bikin Akun (Registrasi)
        </h2>
        <div class="grid grid-cols-2 gap-4 mb-4">
          <input
            type="text"
            id="regUser"
            placeholder="Username"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />
          <input
            type="text"
            id="regEmail"
            placeholder="Email / HP"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />
          <input
            type="password"
            id="regPass"
            placeholder="Password"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />
          <input
            type="text"
            id="regNama"
            placeholder="Nama Lengkap"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none"
          />
        </div>
        <button
          onclick="registrasi()"
          class="w-full bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 transition"
        >
          Daftar & Kirim OTP
        </button>
      </div>

      <!-- 2. Form Verifikasi -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-700 mb-2">2. Verifikasi OTP</h2>
        <p class="text-sm text-rose-500 font-medium mb-4">
          Penting: Cek 6 digit angka OTP-nya di terminal Spring Boot kamu!
        </p>
        <div class="flex gap-4">
          <input
            type="text"
            id="otpCode"
            placeholder="Masukkan 6 Digit OTP"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-green-500 outline-none"
          />
          <button
            onclick="verifikasi()"
            class="bg-green-600 text-white font-semibold px-6 py-2 rounded-lg hover:bg-green-700 transition"
          >
            Verifikasi
          </button>
        </div>
      </div>

      <!-- 3. Form Cek Profil -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-700 mb-4">3. Cek Profil</h2>
        <div class="flex gap-4">
          <input
            type="text"
            id="cekIdUser"
            placeholder="ID User (contoh: USR001)"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-purple-500 outline-none"
          />
          <button
            onclick="cekProfil()"
            class="bg-purple-600 text-white font-semibold px-6 py-2 rounded-lg hover:bg-purple-700 transition"
          >
            Cari
          </button>
        </div>
      </div>

      <!-- 4. Pemesanan -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-700 mb-4">4. Pemesanan</h2>
        <div class="grid grid-cols-2 gap-4 mb-3">
          <input id="pmsIdPembeli" type="text" placeholder="ID Pembeli (contoh: USR001)"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
          <input id="pmsIdPostingan" type="text" placeholder="ID Postingan (contoh: PST001)"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
          <input id="pmsJumlah" type="number" min="1" value="1" placeholder="Jumlah"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
          <input id="pmsPenyedia" type="text" placeholder="ID Penyedia (wajib)"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
          <input id="pmsLokasi" type="text" placeholder="Lokasi (opsional)"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
          <input id="pmsCatatan" type="text" placeholder="Catatan (opsional)"
            class="border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <button onclick="buatPemesanan()"
          class="w-full bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 transition">
          Buat Pemesanan
        </button>

        <div class="flex gap-3 mt-4">
          <input id="pmsIdPemesanan" type="text" placeholder="ID Pemesanan (contoh: PMS001)"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-purple-500 outline-none" />
          <button onclick="lihatPemesanan()"
            class="bg-purple-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-purple-700 transition">
            Detail
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-3">
          <button onclick="aksiPemesanan('terima')"
            class="bg-emerald-600 text-white font-semibold px-3 py-2 rounded-lg hover:bg-emerald-700 transition">
            Terima
          </button>
          <button onclick="aksiPemesanan('tolak')"
            class="bg-rose-600 text-white font-semibold px-3 py-2 rounded-lg hover:bg-rose-700 transition">
            Tolak
          </button>
          <button onclick="aksiPemesanan('selesai')"
            class="bg-slate-700 text-white font-semibold px-3 py-2 rounded-lg hover:bg-slate-800 transition">
            Selesai
          </button>
        </div>

        <div class="flex gap-3 mt-4">
          <input id="pmsIdDaftar" type="text" placeholder="ID Pembeli / Penyedia"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-slate-500 outline-none" />
          <button onclick="daftarPemesanan('pembeli')"
            class="bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-slate-700 transition">
            Pesanan Pembeli
          </button>
          <button onclick="daftarPemesanan('penyedia')"
            class="bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-slate-700 transition">
            Pesanan Penyedia
          </button>
        </div>
      </div>

      <!-- 5. Pembayaran -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-700 mb-4">5. Pembayaran</h2>
        <div class="flex gap-3 mb-3">
          <input id="payIdPesanan" type="text" placeholder="ID Pesanan (contoh: PSN001)"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-green-500 outline-none" />
          <input id="payMetode" type="text" placeholder="Metode (transfer/tunai)"
            class="border p-2 rounded w-56 focus:ring-2 focus:ring-green-500 outline-none" />
          <button onclick="buatPembayaran()"
            class="bg-green-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-green-700 transition">
            Buat
          </button>
        </div>

        <div class="flex gap-3 mb-3">
          <input id="payIdPembayaran" type="text" placeholder="ID Pembayaran (contoh: PBY001)"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-emerald-500 outline-none" />
          <input id="payPenyedia" type="text" placeholder="ID Penyedia (wajib)"
            class="border p-2 rounded w-56 focus:ring-2 focus:ring-emerald-500 outline-none" />
          <button onclick="lihatPembayaran()"
            class="bg-emerald-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-emerald-700 transition">
            Detail
          </button>
        </div>

        <div class="flex gap-3 mb-3">
          <input id="payBukti" type="text" placeholder="URL / path bukti pembayaran"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-teal-500 outline-none" />
          <button onclick="simpanBukti()"
            class="bg-teal-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-teal-700 transition">
            Simpan Bukti
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="aksiPembayaran('konfirmasi')"
            class="bg-emerald-700 text-white font-semibold px-3 py-2 rounded-lg hover:bg-emerald-800 transition">
            Konfirmasi
          </button>
          <button onclick="aksiPembayaran('perbaikan')"
            class="bg-amber-600 text-white font-semibold px-3 py-2 rounded-lg hover:bg-amber-700 transition">
            Minta Perbaikan
          </button>
        </div>

        <div class="flex gap-3 mt-4">
          <input id="payCariPesanan" type="text" placeholder="Cari pembayaran berdasarkan ID Pesanan"
            class="border p-2 rounded flex-1 focus:ring-2 focus:ring-slate-500 outline-none" />
          <button onclick="cariPembayaranPesanan()"
            class="bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-slate-700 transition">
            Cari
          </button>
        </div>
      </div>

      <!-- Log Output -->
      <div class="bg-slate-900 rounded-xl shadow-sm overflow-hidden">
        <div class="bg-slate-800 px-4 py-2 border-b border-slate-700">
          <h3 class="text-slate-300 font-semibold text-sm">
            Response Output JSON
          </h3>
        </div>
        <pre
          id="hasil"
          class="p-4 text-emerald-400 font-mono text-sm overflow-x-auto whitespace-pre-wrap"
        >
Silakan jalankan aksi di atas...</pre
        >
      </div>
    </div>

    <script>
      // Simpan data registrasi sementara karena endpoint verifikasi butuh data ini lagi
      let dataRegistrasi = {};

      function tampilkanLog(data) {
        document.getElementById("hasil").innerText = JSON.stringify(
          data,
          null,
          4,
        );
      }

      function registrasi() {
        dataRegistrasi = {
          username: document.getElementById("regUser").value,
          email_atau_hp: document.getElementById("regEmail").value,
          password: document.getElementById("regPass").value,
          nama_lengkap: document.getElementById("regNama").value,
        };

        document.getElementById("hasil").innerText = "Loading registrasi...";

        fetch("/api/profil/registrasi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dataRegistrasi),
        })
          .then((res) => res.json())
          .then((data) => tampilkanLog(data))
          .catch(
            (err) =>
              (document.getElementById("hasil").innerText = "Error: " + err),
          );
      }

      function verifikasi() {
        const kodeInput = document.getElementById("otpCode").value;
        if (!kodeInput) {
          alert("Isi kode OTP dulu!");
          return;
        }

        // Gabungkan data registrasi awal dengan kode OTP
        const payload = { ...dataRegistrasi, kode_input: kodeInput };
        document.getElementById("hasil").innerText = "Loading verifikasi...";

        fetch("/api/profil/verifikasi", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then((res) => res.json())
          .then((data) => {
            tampilkanLog(data);
            // Kalau berhasil, otomatis isi ID User ke kotak Cek Profil
            if (data.berhasil && data.data && data.data.id_user) {
              document.getElementById("cekIdUser").value = data.data.id_user;
            }
          })
          .catch(
            (err) =>
              (document.getElementById("hasil").innerText = "Error: " + err),
          );
      }

      function cekProfil() {
        const id = document.getElementById("cekIdUser").value;
        if (!id) {
          alert("Isi ID User dulu!");
          return;
        }

        document.getElementById("hasil").innerText = "Mencari data...";

        fetch("/api/profil/" + id)
          .then((res) => res.json())
          .then((data) => tampilkanLog(data))
          .catch(
            (err) =>
              (document.getElementById("hasil").innerText = "Error: " + err),
          );
      }

      // ================= PEMESANAN & PEMBAYARAN =================

      function nilai(id) {
        return document.getElementById(id).value.trim();
      }

      function panggilApi(url, method = "GET", payload = null) {
        document.getElementById("hasil").innerText = "Loading " + url + "...";
        const opsi = { method };
        if (payload) {
          opsi.headers = { "Content-Type": "application/json" };
          opsi.body = JSON.stringify(payload);
        }
        return fetch(url, opsi)
          .then((res) => res.json())
          .then((data) => {
            tampilkanLog(data);
            return data;
          })
          .catch((err) => {
            document.getElementById("hasil").innerText = "Error: " + err;
            return null;
          });
      }

      function buatPemesanan() {
        if (!nilai("pmsIdPembeli") || !nilai("pmsIdPostingan")) {
          alert("ID Pembeli dan ID Postingan wajib diisi!");
          return;
        }

        panggilApi("/api/pemesanan", "POST", {
          id_pembeli: nilai("pmsIdPembeli"),
          id_postingan: nilai("pmsIdPostingan"),
          jumlah: parseInt(nilai("pmsJumlah"), 10) || 0,
          lokasi: nilai("pmsLokasi"),
          catatan: nilai("pmsCatatan"),
        }).then((data) => {
          if (data && data.berhasil && data.data && data.data.pemesanan) {
            document.getElementById("pmsIdPemesanan").value =
              data.data.pemesanan.id_pemesanan;
            document.getElementById("payIdPesanan").value =
              data.data.pemesanan.id_pesanan;
          }
        });
      }

      function lihatPemesanan() {
        if (!nilai("pmsIdPemesanan")) {
          alert("Isi ID Pemesanan dulu!");
          return;
        }
        panggilApi("/api/pemesanan/" + nilai("pmsIdPemesanan"));
      }

      function aksiPemesanan(aksi) {
        if (!nilai("pmsIdPemesanan")) {
          alert("Isi ID Pemesanan dulu!");
          return;
        }
        const method = aksi === "selesai" ? "POST" : "PUT";
        panggilApi(
          "/api/pemesanan/" + nilai("pmsIdPemesanan") + "/" + aksi,
          method,
          { id_penyedia: nilai("pmsPenyedia") },
        );
      }

      function daftarPemesanan(jenis) {
        if (!nilai("pmsIdDaftar")) {
          alert("Isi ID Pembeli / Penyedia dulu!");
          return;
        }
        panggilApi("/api/pemesanan/" + jenis + "/" + nilai("pmsIdDaftar"));
      }

      function buatPembayaran() {
        if (!nilai("payIdPesanan") || !nilai("payMetode")) {
          alert("ID Pesanan dan metode wajib diisi!");
          return;
        }
        panggilApi("/api/pembayaran", "POST", {
          id_pesanan: nilai("payIdPesanan"),
          metode: nilai("payMetode"),
        }).then((data) => {
          if (data && data.berhasil && data.data && data.data.pembayaran) {
            document.getElementById("payIdPembayaran").value =
              data.data.pembayaran.id_pembayaran;
          }
        });
      }

      function lihatPembayaran() {
        if (!nilai("payIdPembayaran")) {
          alert("Isi ID Pembayaran dulu!");
          return;
        }
        panggilApi("/api/pembayaran/" + nilai("payIdPembayaran"));
      }

      function simpanBukti() {
        if (!nilai("payIdPembayaran") || !nilai("payBukti")) {
          alert("Isi ID Pembayaran dan URL/path bukti!");
          return;
        }
        panggilApi(
          "/api/pembayaran/" + nilai("payIdPembayaran") + "/bukti",
          "POST",
          { bukti_pembayaran: nilai("payBukti") },
        );
      }

      function aksiPembayaran(aksi) {
        if (!nilai("payIdPembayaran")) {
          alert("Isi ID Pembayaran dulu!");
          return;
        }
        panggilApi(
          "/api/pembayaran/" + nilai("payIdPembayaran") + "/" + aksi,
          "PUT",
          { id_penyedia: nilai("payPenyedia") },
        );
      }

      function cariPembayaranPesanan() {
        if (!nilai("payCariPesanan")) {
          alert("Isi ID Pesanan dulu!");
          return;
        }
        panggilApi("/api/pembayaran/pesanan/" + nilai("payCariPesanan"));
      }
    </script>
  </body>
</html>
