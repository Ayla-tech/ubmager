<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Kartu header profil, dipakai profil sendiri dan profil publik -->
<section th:fragment="header(p, sendiri)" class="card flex flex-col gap-5 sm:flex-row sm:items-center">
  <span th:if="${p.fotoUrl() == null}" class="avatar h-24 w-24 text-3xl" th:text="${p.inisial()}">AB</span>
  <img th:if="${p.fotoUrl() != null}" th:src="${p.fotoUrl()}" th:alt="${p.nama()}" class="h-24 w-24 shrink-0 rounded-full border border-stone-200 object-cover" />

  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-center gap-2">
      <h1 class="text-2xl font-extrabold" th:text="${p.nama()}">Nama</h1>
      <span th:if="${p.terpercaya()}" class="badge-terpercaya" th:text="${p.badge()}">Penjual Terpercaya</span>
      <span th:unless="${p.terpercaya()}" class="badge-baru" th:text="${p.badge()}">Pengguna Terpercaya Baru</span>
    </div>
    <p class="text-sm text-stone-500">@<span th:text="${p.username()}">username</span> &middot; bergabung <span th:text="${p.bergabung()}">1 Jan 2026</span></p>
    <p th:if="${sendiri}" class="text-sm text-stone-500" th:text="${p.kontak()}">kontak</p>

    <div class="mt-3 flex items-center gap-2">
      <span th:replace="~{fragments/base :: bintang(${p.bintang()})}"></span>
      <span class="text-lg font-extrabold" th:text="${p.ratingTampil()}">4.5</span>
      <span class="text-sm text-stone-500">(<span th:text="${p.jumlahReview()}">0</span> review)</span>
    </div>

    <p th:if="${p.bio() != null and !p.bio().isBlank()}" class="mt-3 whitespace-pre-line text-sm leading-relaxed text-stone-700" th:text="${p.bio()}">Bio</p>
    <p th:if="${p.bio() == null or p.bio().isBlank()}" class="mt-3 text-sm italic text-stone-400">Belum ada bio.</p>
  </div>
</section>
</body>
</html>
