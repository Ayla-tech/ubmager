<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Dialog konfirmasi bersama untuk aksi Pemesanan/Pembayaran. -->
<dialog th:fragment="dialog" id="dialogKonfirmasi"
        class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-stone-200 bg-white p-0 text-ink shadow-xl backdrop:bg-ink/40">
  <form method="dialog" class="p-6">
    <h2 id="dialogJudul" class="text-lg font-extrabold">Konfirmasi</h2>
    <p id="dialogPesan" class="mt-2 text-sm leading-relaxed text-stone-600"></p>
    <div class="mt-6 flex flex-wrap justify-end gap-2">
      <button value="batal" class="btn-outline">Batal</button>
      <button value="setuju" id="dialogSetuju" class="btn-primary">Ya, lanjutkan</button>
    </div>
  </form>
</dialog>

</body>
</html>
