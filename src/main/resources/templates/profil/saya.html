<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Profil Saya')}"></head>
<body class="flex min-h-screen flex-col">
<header th:replace="~{fragments/base :: navbar('profil')}"></header>

<main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
  <div th:replace="~{fragments/base :: alert}"></div>
  <div th:replace="~{fragments/profil :: header(${profil}, true)}"></div>

  <div class="mt-6 grid gap-6 lg:grid-cols-3">
    <!-- Review yang diterima -->
    <section class="lg:col-span-2">
      <h2 class="mb-3 text-lg font-extrabold">Review untukmu</h2>
      <div th:if="${#lists.isEmpty(daftarReview)}" class="card text-center text-sm text-stone-500">Belum ada review untukmu.</div>
      <div class="space-y-3">
        <th:block th:each="r : ${daftarReview}">
          <div th:replace="~{fragments/base :: reviewItem(${r}, ${sudahDilapor.contains(r.idReview())}, '/profil', true)}"></div>
        </th:block>
      </div>
    </section>

    <aside class="space-y-6">
      <!-- Ubah profil -->
      <section class="card">
        <h2 class="mb-4 text-lg font-extrabold">Ubah profil</h2>
        <form th:action="@{/profil}" method="post" class="space-y-4">
          <div>
            <label for="namaLengkap" class="label">Nama lengkap</label>
            <input id="namaLengkap" name="namaLengkap" type="text" required maxlength="100" class="input" th:value="${profil.nama()}" />
          </div>
          <div>
            <label for="fotoProfil" class="label">Foto profil (tautan)</label>
            <input id="fotoProfil" name="fotoProfil" type="url" maxlength="255" class="input" placeholder="https://..." th:value="${profil.fotoUrl()}" />
            <p class="hint">Kosongkan untuk memakai inisial.</p>
          </div>
          <div>
            <label for="bio" class="label">Bio</label>
            <textarea id="bio" name="bio" rows="4" maxlength="500" class="input" th:text="${profil.bio()}"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full">Simpan perubahan</button>
        </form>
      </section>

      <!-- Kelola akun -->
      <section class="card border-red-200">
        <h2 class="mb-1 text-lg font-extrabold text-red-700">Kelola akun</h2>
        <p class="mb-4 text-sm text-stone-500">Nonaktifkan sementara atau hapus akunmu.</p>
        <form th:action="@{/profil/akun}" method="post" class="space-y-4">
          <div>
            <label for="pilihan" class="label">Pilihan</label>
            <select id="pilihan" name="pilihan" class="input">
              <option value="NONAKTIF_SEMENTARA">Nonaktifkan sementara</option>
              <option value="HAPUS_PERMANEN">Hapus permanen</option>
            </select>
          </div>
          <div>
            <label for="passwordAkun" class="label">Password</label>
            <input id="passwordAkun" name="password" type="password" required class="input" />
          </div>
          <label class="flex items-start gap-2 text-sm text-stone-700">
            <input type="checkbox" name="konfirmasi" value="true" class="mt-0.5 h-4 w-4 accent-brand-500" />
            <span>Saya yakin dengan pilihan ini</span>
          </label>
          <button type="submit" class="btn-danger w-full">Proses akun</button>
        </form>
      </section>
    </aside>
  </div>
</main>

<footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
