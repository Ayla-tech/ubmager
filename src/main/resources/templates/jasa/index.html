<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Jelajahi Jasa')}"></head>
<body class="flex min-h-screen flex-col">
<header th:replace="~{fragments/base :: navbar('jasa')}"></header>

<main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
  <div th:replace="~{fragments/base :: alert}"></div>

  <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-xs font-bold uppercase tracking-wider text-brand-600">Jelajahi</p>
      <h1 class="mt-1 text-2xl font-extrabold sm:text-3xl">Pilih jasa yang kamu butuhkan</h1>
      <p class="mt-1 text-sm text-stone-500">Bandingkan harga dan reputasi penyedia sebelum mengajukan pesanan.</p>
    </div>
    <a th:href="@{/pemesanan}" class="btn-outline shrink-0">Pemesanan saya</a>
  </div>

  <div th:if="${#lists.isEmpty(daftarJasa)}" class="card mt-8 text-center text-sm text-stone-500">
    Belum ada penawaran aktif. Kembali ke <a th:href="@{/}" class="font-semibold text-brand-600 hover:underline">beranda</a> untuk melihat penawaran lain.
  </div>

  <div class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
    <article th:each="p : ${daftarJasa}" class="card flex flex-col p-5 transition hover:-translate-y-0.5 hover:shadow-md">
      <span class="badge w-fit bg-brand-100 text-brand-700" th:text="${p.kategori()}">Kategori</span>
      <h2 class="mt-3 text-base font-bold leading-snug">
        <a th:href="@{/jasa/{id}(id=${p.idPostingan()})}" class="hover:text-brand-600" th:text="${p.judul()}">Judul jasa</a>
      </h2>
      <p class="mt-1.5 line-clamp-2 text-sm text-stone-600" th:text="${p.deskripsi()}">Deskripsi</p>
      <p class="mt-3 text-lg font-extrabold text-brand-600" th:text="${p.harga()}">Rp 0</p>

      <div class="mt-4 flex items-center gap-3 border-t border-stone-100 pt-4">
        <span class="avatar h-10 w-10 text-sm" th:text="${p.inisial()}">AB</span>
        <span class="min-w-0 flex-1">
          <a th:href="@{/pengguna/{id}(id=${p.idPenjual()})}" class="block truncate text-sm font-bold text-ink hover:text-brand-600" th:text="${p.namaPenjual()}">Penjual</a>
          <span class="flex items-center gap-1.5 text-xs text-stone-500">
            <span th:if="${p.adaReview()}" class="flex items-center gap-1.5">
              <span th:replace="~{fragments/base :: bintang(${p.bintang()})}"></span>
              <span th:text="${p.ratingTampil()}">4.5</span>
            </span>
            <span th:unless="${p.adaReview()}">Belum ada review</span>
          </span>
        </span>
        <span th:if="${p.terpercaya()}" class="badge-terpercaya">Terpercaya</span>
      </div>

      <a th:href="@{/jasa/{id}(id=${p.idPostingan()})}" class="btn-primary btn-sm mt-4 w-full">Lihat &amp; pesan</a>
    </article>
  </div>
</main>

<footer th:replace="~{fragments/base :: footer}"></footer>
</body>
</html>
